1. Create a kind-config file
nano kind-config.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090
        hostPort: 30090
      - containerPort: 30093
        hostPort: 30093
      - containerPort: 30080
        hostPort: 30080
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"



2. Create a kind cluster with the config file given below
kind create cluster --name cfk-saslssl-cluster --config kind-config.yaml



3. Check the cluster info
kubectl cluster-info --context kind-cfk-saslssl-cluster


4. Create a namespace 
kubectl create namespace confluent


5. Install Confluent For Kubernetes using Helm:
helm upgrade --install operator confluentinc/confluent-for-kubernetes --namespace confluent


6. create a local variable using 
export Var=/home/nandan/confluent-test/kraft-sasl-ssl/
(will be used to easily create certificates later)


7. Create a OpenSSL certificate
openssl genrsa -out $Var/ca-key.pem 2048

openssl req -new -key $Var/ca-key.pem -x509   -days 1000   -out $Var/ca.pem   -subj "/C=IN/ST=KA/L=Bengaluru/O=Platformatory/OU=CFK/CN=mTlsCA"


8. Create a secret to store the creds and certificated which will be used and referenced by other services

kubectl create secret tls ca-pair-sslcerts   --cert=$Var/ca.pem   --key=$Var/ca-key.pem -n confluent

kubectl create -n confluent secret generic credential \
  --from-file=plain.txt=$Var/plain.txt \
  --from-file=plain-users.json=$Var/plain-users.json \
  --from-file=basic.txt=$Var/basic.txt


9. Create and deploy the confluent-platform.yaml file with the following contents below

apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  dataVolumeCapacity: 10G
  image:
    application: docker.io/confluentinc/cp-server:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  listeners:
    controller:
      tls:
        enabled: true
      authentication:
        type: plain
        jaasConfig:
          secretRef: credential
  tls:
    autoGeneratedCerts: true
  replicas: 3
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  dependencies:
    kRaftController:
      controllerListener:
        tls:
          enabled: true
        authentication:
          type: plain
          jaasConfig:
            secretRef: credential
      clusterRef:
        name: kraftcontroller
  dataVolumeCapacity: 10G
  image:
    application: docker.io/confluentinc/cp-server:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  tls:
    autoGeneratedCerts: true
  replicas: 3
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestClass
metadata:
  name: krc-cfk
  namespace: confluent
spec:
  kafkaClusterRef:
    name: kafka
  kafkaRest:
    endpoint: http://kafka.confluent.svc.cluster.local:8090
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaTopic
metadata:
  name: demotopic
  namespace: confluent
spec:
  kafkaRestClassRef:
    name: krc-cfk
  replicas: 3
  partitionCount: 4
  configs:
    cleanup.policy: "delete"


10. Deploy the Confluent-platform yaml file 
kubectl apply -f confluent-platform.yaml -n confluent


11. Check for pods to be up and running 
kubectl get pods -n confluent -w



12. Once all the pods are up and running check for the secrets and pvcs that will be automatically created by the services
kubectl get secrets -n confluent
kubectl get pvc -n confluent



13. Check if everything is working
kubectl exec -it kafka-0 -n confluent -- bash




cat <<EOF > /tmp/client-plain.properties
security.protocol=SASL_PLAINTEXT
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required \
  username="kafka" \
  password="kafka-secret";
EOF


kafka-topics \
  --bootstrap-server kafka.confluent.svc.cluster.local:9092 \
  --command-config /tmp/client-plain.properties \
  --create \
  --topic my-secure-topic \
  --partitions 3 \
  --replication-factor 3


kafka-topics \
  --bootstrap-server kafka.confluent.svc.cluster.local:9092 \
  --command-config /tmp/client-plain.properties \
  --list




14. CleanUp

kubectl delete -f confluent-platform.yaml 

helm uninstall operator -n confluent

kind delete cluster --name cfk-saslssl-cluster