---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  podTemplate:
    probe:
      liveness:
        periodSeconds: 10
        failureThreshold: 5
        timeoutSeconds: 500
  image:
    application: confluentinc/cp-enterprise-control-center:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  dataVolumeCapacity: 10Gi
  externalAccess:
    type: loadBalancer
    loadBalancer:
      domain: mydomain.example
      prefix: controlcenter
  tls:
    secretRef: tls-controlcenter
  dependencies:
    kafka:
      bootstrapEndpoint: kafka.confluent.svc.cluster.local:9071
      authentication:
        type: mtls
      tls:
        enabled: true
    connect:
      - name: connect
        url:  https://connect.confluent.svc.cluster.local:8083
        authentication:
          type: mtls
        tls:
          enabled: true
    ksqldb:
      - name: ksqldb
        url:  https://ksqldb.confluent.svc.cluster.local:8088
        authentication:
          type: mtls
        tls:
          enabled: true
    schemaRegistry:
      url: https://schemaregistry.confluent.svc.cluster.local:8081
      authentication:
        type: mtls
      tls:
        enabled: true






9. Deploy the Confluent-platform yaml file 
kubectl apply -f confluent-platform.yaml -n confluent



10. Check for pods to be up and running 
kubectl get pods -n confluent -w



11. Once all the pods are up and running check for the secrets and pvcs that will be automatically created by the services
kubectl get secrets -n confluent
kubectl get pvc -n confluent



12. Check if everything is working

kubectl exec -it kafka-0 -n confluent -- bash



Create a fiel to pass as a configuration 

cat <<EOF > /tmp/client.properties
security.protocol=SSL
ssl.truststore.location=/tmp/kafka.truststore.jks
ssl.truststore.password=mystorepassword
ssl.keystore.location=/tmp/kafka.keystore.jks
ssl.keystore.password=mystorepassword
ssl.key.password=mystorepassword
EOF



Create a jks for all the components to use

---  
apiVersion: platform.confluent.io/v1beta1
# Create truststore
keytool -importcert \
  -trustcacerts \
  -alias CARoot \
  -file /mnt/sslcerts/cacerts.pem \
  -keystore /tmp/kafka.truststore.jks \
  -storepass mystorepassword \
  -noprompt

# Create PKCS12 keystore first
openssl pkcs12 -export \
  -in /mnt/sslcerts/fullchain.pem \
  -inkey /mnt/sslcerts/privkey.pem \
  -out /tmp/kafka-keystore.p12 \
  -name kafka \
  -CAfile /mnt/sslcerts/cacerts.pem \
  -caname root \
  -password pass:mystorepassword

# Convert to JKS keystore
keytool -importkeystore \
  -deststorepass mystorepassword \
  -destkeypass mystorepassword \
  -destkeystore /tmp/kafka.keystore.jks \
  -srckeystore /tmp/kafka-keystore.p12 \
  -srcstoretype PKCS12 \
  -srcstorepass mystorepassword \
  -alias kafka


Check to see if everything is working fine

kafka-topics.sh --bootstrap-server kafka.confluent.svc.cluster.local:9071 --command-config /tmp/client.properties -list


To access the control center

kubectl port-forward controlcenter-0 9021:9021 --namespace confluent

https://localhost:9021



14. CleanUp

kubectl delete -f confluent-platform.yaml 

helm uninstall operator -n confluent

kind delete cluster --name cfk-mtls-cluster








