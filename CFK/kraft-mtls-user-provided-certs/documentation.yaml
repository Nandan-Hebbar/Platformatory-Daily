Uses auto generated certificates

1. Create a kind-config file
nano kind-config.yaml

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30090
        hostPort: 30090
      - containerPort: 30093
        hostPort: 30093
      - containerPort: 30080
        hostPort: 30080
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"



2. Create a kind cluster with the config file given below
kind create cluster --name cfk-mtls-cluster --config kind-config.yaml



3. Check the cluster info
kubectl cluster-info --context kind-cfk-mtls-cluster


4. Create a namespace 
kubectl create namespace confluent


5. Install Confluent For Kubernetes using Helm:
helm upgrade --install operator confluentinc/confluent-for-kubernetes --namespace confluent


6. Refer the content of this shell script for generating the custom certificates for each and every components
---
#!/bin/bash

set -e

# === CONFIG ===
CA_DIR=certs/ca
COMPONENTS=("kraftcontroller" "kafka" "connect" "schemaregistry" "ksqldb" "controlcenter" "kafkarestproxy")
NAMESPACE=confluent
DAYS_VALID=1000
CLUSTER_DOMAIN="svc.cluster.local"

# === Create CA ===
mkdir -p $CA_DIR
openssl genrsa -out $CA_DIR/ca.key 4096
openssl req -x509 -new -nodes -key $CA_DIR/ca.key -sha256 -days 3650 -out $CA_DIR/ca.pem \
  -subj "/C=IN/ST=KA/L=Bangalore/O=Platformatory/OU=PlatformTeam/CN=platformatory-ca"

# === Generate certs for each component ===
for COMPONENT in "${COMPONENTS[@]}"; do
  echo "Generating certificate for $COMPONENT"
  COMP_DIR=certs/$COMPONENT
  mkdir -p $COMP_DIR

  # Private Key
  openssl genrsa -out $COMP_DIR/${COMPONENT}.key 2048

  # CSR
  openssl req -new -key $COMP_DIR/${COMPONENT}.key -out $COMP_DIR/${COMPONENT}.csr \
    -subj "/C=IN/ST=KA/L=Bangalore/O=Platformatory/OU=Confluent/CN=${COMPONENT}.${NAMESPACE}.${CLUSTER_DOMAIN}"

  # SAN config
  cat > $COMP_DIR/${COMPONENT}.ext <<EOF
authorityKeyIdentifier=keyid,issuer
basicConstraints=CA:FALSE
keyUsage = digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth, clientAuth
subjectAltName = @alt_names

[alt_names]
DNS.1 = kraftcontroller
DNS.2 = kraftcontroller.confluent
DNS.3 = kraftcontroller.confluent.svc
DNS.4 = kraftcontroller.confluent.svc.cluster.local
DNS.5 = kraftcontroller-0.kraftcontroller.confluent.svc.cluster.local
DNS.6 = kraftcontroller-1.kraftcontroller.confluent.svc.cluster.local
DNS.7 = kraftcontroller-2.kraftcontroller.confluent.svc.cluster.local
EOF

  # Signed cert
  openssl x509 -req -in $COMP_DIR/${COMPONENT}.csr -CA $CA_DIR/ca.pem -CAkey $CA_DIR/ca.key \
    -CAcreateserial -out $COMP_DIR/${COMPONENT}.crt -days $DAYS_VALID -sha256 \
    -extfile $COMP_DIR/${COMPONENT}.ext

  # Kubernetes secret
  kubectl create secret generic tls-${COMPONENT} \
    --from-file=fullchain.pem=$COMP_DIR/${COMPONENT}.crt \
    --from-file=cacerts.pem=$CA_DIR/ca.pem \
    --from-file=privkey.pem=$COMP_DIR/${COMPONENT}.key \
    --namespace $NAMESPACE

  echo "Secret tls-${COMPONENT} created in namespace $NAMESPACE"
done

echo "All component certificates and secrets created."


---

7. Make the file executable and run it

chmod +x ./generate-confluent-mtls-certs.sh

./generate-confluent-mtls-certs.sh




