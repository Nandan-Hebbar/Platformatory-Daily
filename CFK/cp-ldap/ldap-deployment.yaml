apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap
  namespace: confluent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      labels:
        app: ldap
    spec:
      containers:
        - name: ldap
          image: avinashupadhya99/example_com_openldap:1.0.0
          ports:
            - containerPort: 389
          env:
            - name: LDAP_ORGANISATION
              value: "Example Company"
            - name: LDAP_DOMAIN
              value: "example.com"
            - name: LDAP_ADMIN_PASSWORD
              value: "secret"
---
apiVersion: v1
kind: Service
metadata:
  name: ldap
  namespace: confluent
spec:
  ports:
    - port: 389
      targetPort: 389
      protocol: TCP
  selector:
    app: ldap
