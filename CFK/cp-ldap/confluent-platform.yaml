---
apiVersion: platform.confluent.io/v1beta1
kind: KRaftController
metadata:
  name: kraftcontroller
  namespace: confluent
spec:
  dataVolumeCapacity: 10G
  image:
    application: docker.io/confluentinc/cp-server:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  replicas: 3
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  dataVolumeCapacity: 100Gi
  configOverrides:
    log4j:
      - log4j.rootLogger=INFO, stdout
      - log4j.logger.io.confluent.kafka.security.auth=DEBUG
      - log4j.logger.io.confluent.metadata=DEBUG
      - log4j.logger.io.confluent.rest-utils=DEBUG
      - log4j.logger.kafka.authorizer.logger=DEBUG
      - log4j.logger.kafka.network=DEBUG
  dependencies:
    kRaftController:
      clusterRef:
        name: kraftcontroller
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  dependencies:
    kafka:
      bootstrapEndpoint: kafka:9071
---
apiVersion: platform.confluent.io/v1beta1
kind: KsqlDB
metadata:
  name: ksqldb
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-ksqldb-server:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  dataVolumeCapacity: 10Gi
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  dataVolumeCapacity: 10Gi

  configOverrides:
    log4j:
      - log4j.rootLogger=DEBUG, stdout

  authentication:
    type: ldap
    ldap:
      roles: [Administrators, BackendDev, FrontendDev, Developer, KafkaDev, KafkaAdmin]
      #restrictedRoles: [FrontendDev]
      property:
        useLdaps: "false"
        debug: "true"
        contextFactory: "com.sun.jndi.ldap.LdapCtxFactory"
        hostname: "ldap.confluent.svc.cluster.local"
        port: "389"

        bindDn: "cn=admin,dc=example,dc=com"
        bindPassword: "secret"
        authenticationMethod: "simple"
        forceBindingLogin: "false"

        userBaseDn: "ou=users,dc=example,dc=com"
        userObjectClass: "person"
        userRdnAttribute: "cn"
        userIdAttribute: "cn"
        userSearchFilter: "(objectClass=person)"
        userSearchScope: "2"

        roleBaseDn: "ou=groups,dc=example,dc=com"
        roleNameAttribute: "cn"
        roleObjectClass: "groupOfNames"
        roleMemberAttribute: "member"
        roleMemberAttributePattern: "cn=([^,]+),ou=users,dc=example,dc=com"

        searchPageSize: "1000"
        ldapLoggerLevel: "DEBUG"

---
apiVersion: platform.confluent.io/v1beta1
kind: SchemaRegistry
metadata:
  name: schemaregistry
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-schema-registry:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
---
apiVersion: platform.confluent.io/v1beta1
kind: KafkaRestProxy
metadata:
  name: kafkarestproxy
  namespace: confluent
spec:
  dependencies:
    schemaRegistry:
      url: http://schemaregistry.confluent.svc.cluster.local:8081
  image:
    application: confluentinc/cp-kafka-rest:7.9.0
    init: confluentinc/confluent-init-container:2.11.0
  replicas: 1
